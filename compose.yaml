services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: https://${FICHAPRO_DOMAIN:?Defina FICHAPRO_DOMAIN no .env}
      DB_PATH: /app/data/fichapro.sqlite
    volumes:
      - fichapro_data:/app/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      FICHAPRO_DOMAIN: ${FICHAPRO_DOMAIN:?Defina FICHAPRO_DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  fichapro_data:
  caddy_data:
  caddy_config:
